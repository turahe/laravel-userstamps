name: PHP Tests

# This workflow includes:
# 1. Matrix Tests: Testing across MySQL and PostgreSQL with Laravel 12 and 13 on PHP 8.4
# 2. Multi-Database Tests: Runs the suite against both supported server databases
# 3. Makefile Validation: Ensures documented local test targets parse correctly
# 4. Code Style: Runs Laravel Pint for code formatting

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Matrix Tests - Laravel ${{ matrix.laravel }} - PHP 8.4 - ${{ matrix.database }}

    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        laravel: [12, 13]
        database: [mysql, postgres]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_userstamps_test
          MYSQL_USER: laravel_userstamps
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: laravel_userstamps_test
          POSTGRES_USER: laravel_userstamps
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_pgsql, dom, filter, gd, iconv, json, mbstring, pdo, phar, tokenizer, xml, xmlwriter
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Setup Laravel ${{ matrix.laravel }}
      run: |
        composer require "laravel/framework:${{ matrix.laravel }}.*" --no-interaction --no-update
        composer update --no-interaction

    - name: Create environment file
      run: |
        if [ "${{ matrix.database }}" = "mysql" ]; then
          cp env.mysql .env
        elif [ "${{ matrix.database }}" = "postgres" ]; then
          cp env.postgres .env
        fi

    - name: Wait for database
      run: |
        if [ "${{ matrix.database }}" = "mysql" ]; then
          timeout 60 bash -c 'until mysql -h 127.0.0.1 -P 3306 -u laravel_userstamps -ppassword laravel_userstamps_test -e "SELECT 1"; do sleep 2; done'
        elif [ "${{ matrix.database }}" = "postgres" ]; then
          timeout 60 bash -c 'until pg_isready -h 127.0.0.1 -p 5432 -U laravel_userstamps; do sleep 2; done'
        fi

    - name: Run test suite
      run: |
        if [ "${{ matrix.database }}" = "mysql" ]; then
          echo "Running tests with MySQL..."
          vendor/bin/phpunit --no-coverage
        elif [ "${{ matrix.database }}" = "postgres" ]; then
          echo "Running tests with PostgreSQL..."
          vendor/bin/phpunit --no-coverage
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-laravel${{ matrix.laravel }}-php84-${{ matrix.database }}
        path: |
          .phpunit.result.cache
          build/
        retention-days: 7



  multi-database-tests:
    name: Multi-Database Tests (Laravel 12 - PHP 8.4)

    runs-on: ubuntu-26.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_userstamps_test
          MYSQL_USER: laravel_userstamps
          MYSQL_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: laravel_userstamps_test
          POSTGRES_USER: laravel_userstamps
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_pgsql, dom, filter, gd, iconv, json, mbstring, pdo, phar, tokenizer, xml, xmlwriter
        coverage: none

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Setup Laravel 12
      run: |
        composer require "laravel/framework:12.*" --no-interaction --no-update
        composer update --no-interaction

    - name: Create environment files
      run: |
        cp env.mysql .env
        cp env.postgres .env.postgres

    - name: Wait for databases
      run: |
        echo "Waiting for MySQL..."
        timeout 60 bash -c 'until mysql -h 127.0.0.1 -P 3306 -u laravel_userstamps -ppassword laravel_userstamps_test -e "SELECT 1"; do sleep 2; done'
        echo "Waiting for PostgreSQL..."
        timeout 60 bash -c 'until pg_isready -h 127.0.0.1 -p 5432 -U laravel_userstamps; do sleep 2; done'

    - name: Run tests with MySQL
      run: |
        echo "Running tests with MySQL..."
        vendor/bin/phpunit --no-coverage

    - name: Run tests with PostgreSQL
      run: |
        echo "Switching to PostgreSQL..."
        cp .env.postgres .env
        echo "Running tests with PostgreSQL..."
        vendor/bin/phpunit --no-coverage



  makefile-validation:
    name: Makefile Validation
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Validate Makefile targets
      run: make -n help test test-mysql test-postgres test-all

  lint:
    name: Code Style Check

    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: mbstring, xml, ctype, iconv, intl, dom, filter, gd, iconv, json, mbstring, pdo, phar, tokenizer, xml, xmlwriter

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Setup Laravel 12
      run: |
        composer require "laravel/framework:12.*" --no-interaction --no-update
        composer update --no-interaction

    - name: Run Laravel Pint
      run: vendor/bin/pint --test
